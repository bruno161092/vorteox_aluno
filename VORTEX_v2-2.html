    function readSync() {
      try {
        const wkRaw = localStorage.getItem("vortex_wk");
        const dtRaw = localStorage.getItem("vortex_dt");
        const msRaw = localStorage.getItem("vortex_measures");
        const exRaw = localStorage.getItem("vortex_exlib");
        const ts = localStorage.getItem("vortex_ts") || "0";
        const days = ["Hoje", "Amanhã", "Qua", "Qui", "Sex", "Sáb", "Dom"];
        let workouts = null, diet = null, measures = null, exLibrary = null;
        if (wkRaw) {
          const all = JSON.parse(wkRaw);
          const mine = all.filter((w) => w.stu === USER.name);
          if (mine.length > 0) {
            workouts = mine.map((w, i) => ({
              id: String(w.id), name: w.name, day: days[i % days.length],
              done: false, duration: w.dur || 55, updatedAt: w.updAt,
              exercises: w.exs.map((e, j) => {
                const nm = typeof e === "string" ? e : e.name;
                return {id: `ex_${w.id}_${j}`, name: nm, sets: typeof e === "object" ? e.sets || 4 : 4, reps: typeof e === "object" ? e.reps || 12 : 12, weight: typeof e === "object" ? e.kg || 0 : 0, lastWeight: typeof e === "object" ? e.kg || 0 : 0, muscle: typeof e === "object" ? e.muscle || "—" : "—", rest: typeof e === "object" ? e.rest || 60 : 60};
              }),
            }));
          }
        }
        if (dtRaw) {
          const all = JSON.parse(dtRaw);
          const mine = all.filter((d) => d.stu === USER.name);
          if (mine.length > 0) {
            const d = mine[mine.length - 1];
            diet = {name: d.name, targetCalories: d.cal, currentCalories: Math.round(d.cal * 0.67), obs: d.obs || "", macros: {protein: {target: d.prot, current: Math.round(d.prot * 0.61), unit: "g"}, carbs: {target: d.carb, current: Math.round(d.carb * 0.63), unit: "g"}, fat: {target: d.fat, current: Math.round(d.fat * 0.61), unit: "g"}}, meals: DEFAULT_DIET.meals};
          }
        }
        if (msRaw) {const all = JSON.parse(msRaw); if (all[1] && all[1].length > 0) measures = all[1].slice().sort((a, b) => (a.date < b.date ? -1 : 1));}
        if (exRaw) exLibrary = JSON.parse(exRaw);
        return {workouts, diet, measures, exLibrary, ts};
      } catch {return {workouts: null, diet: null, measures: null, exLibrary: null, ts: "0"};}
    }

    function Confetti({active}) {
      const canvasRef = useRef(null);
      useEffect(() => {
        if (!active) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const pieces = Array.from({length: 120}, () => ({x: Math.random() * canvas.width, y: -20 - Math.random() * 100, w: 6 + Math.random() * 8, h: 10 + Math.random() * 6, color: ["#c8f135", "#38bdf8", "#a855f7", "#f97316", "#f43f8e", "#f5b731", "#22d07a"][Math.floor(Math.random() * 7)], speed: 2 + Math.random() * 4, angle: Math.random() * 360, spin: (Math.random() - 0.5) * 8, vx: (Math.random() - 0.5) * 3}));
        let raf;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces.forEach((p) => {p.y += p.speed; p.x += p.vx; p.angle += p.spin; ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h / 2); ctx.rotate((p.angle * Math.PI) / 180); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();});
          if (pieces.some((p) => p.y < canvas.height + 50)) raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(raf);
      }, [active]);
      if (!active) return null;
      return <canvas ref={canvasRef} style={{position: "fixed", inset: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 9999}} />;
    }

    function ParticlesBg({C}) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const resize = () => {canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;};
        resize();
        const pts = Array.from({length: 30}, () => ({x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 1 + Math.random() * 1.5, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, o: 0.1 + Math.random() * 0.3}));
        let raf;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pts.forEach((p) => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${C.accentRgb},${p.o})`; ctx.fill();
          });
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);
        window.addEventListener("resize", resize);
        return () => {cancelAnimationFrame(raf); window.removeEventListener("resize", resize);};
      }, [C.accentRgb]);
      return <canvas ref={canvasRef} style={{position: "fixed", inset: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 0, opacity: 0.6}} />;
    }

        <div style={{width: size, height: size, borderRadius: "50%", background: img ? "transparent" : `linear-gradient(135deg, ${C.lime}30, ${C.lime}60)`, border: `2px solid ${C.lime}60`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.35, fontWeight: 900, color: C.lime, flexShrink: 0, overflow: "hidden"}}>
          {img ? <img src={img} alt={name} style={{width: "100%", height: "100%", objectFit: "cover"}} /> : initials}
        </div>
      );
    }

    function Ring({pct, r = 28, color, C, stroke = 4, children}) {
      const col = color || C.lime;
      const ci = 2 * Math.PI * r;
      const size = r * 2 + stroke * 2 + 4;
      return (
        <div style={{position: "relative", width: size, height: size, flexShrink: 0}}>
          <svg width={size} height={size} style={{transform: "rotate(-90deg)", display: "block"}}>
            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={BASE.dim} strokeWidth={stroke} />
            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={col} strokeWidth={stroke} strokeDasharray={ci} strokeDashoffset={ci * (1 - Math.min(1, pct))} strokeLinecap="round" style={{transition: "stroke-dashoffset .7s cubic-bezier(.34,1.56,.64,1)"}} />
          </svg>
          {children && <div style={{position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center"}}>{children}</div>}
        </div>
      );
    }

    function MacroBar({label, curr, target, color, unit = "g", C}) {
      const pct = Math.min(1, curr / target);
      return (
        <div style={{marginBottom: 7}}>
          <div style={{display: "flex", justifyContent: "space-between", marginBottom: 4}}>
            <span style={{color: BASE.muted, fontSize: 11, fontWeight: 700}}>{label}</span>
            <span style={{color: BASE.text, fontSize: 11, fontWeight: 800}}>{curr}{unit} / {target}{unit}</span>
          </div>
          <div style={{height: 5, background: BASE.dim, borderRadius: 3}}>
            <div style={{height: "100%", width: `${pct * 100}%`, background: color, borderRadius: 3, transition: "width .6s ease"}} />
          </div>
        </div>
      );
    }

    function Badge({label, color, C}) {
      const col = color || C.lime;
      return <span style={{padding: "2px 9px", borderRadius: 999, fontSize: 11, fontWeight: 700, background: `${col}18`, color: col, border: `1px solid ${col}30`}}>{label}</span>;
    }

    function Glass({children, style = {}, glow = false, C}) {
      return (
        <div style={{background: "rgba(12,15,24,0.7)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", border: `1px solid rgba(${C.accentRgb},0.12)`, borderRadius: 20, boxShadow: glow ? `0 0 40px rgba(${C.accentRgb},0.08), inset 0 1px 0 rgba(255,255,255,0.04)` : `inset 0 1px 0 rgba(255,255,255,0.04)`, ...style}}>
          {children}
        </div>
      );
    }

    function RestTimer({seconds, onDone, onClose, C}) {
      const [left, setLeft] = useState(seconds);
      useEffect(() => {
        if (left <= 0) {onDone(); return;}
        const id = setTimeout(() => setLeft((l) => l - 1), 1000);
        return () => clearTimeout(id);
      }, [left]);
      useEffect(() => {
        if (left === 3 && "vibrate" in navigator) navigator.vibrate([100, 50, 100]);
        if (left === 0 && "vibrate" in navigator) navigator.vibrate([200, 100, 200, 100, 200]);
      }, [left]);
      const pct = left / seconds;
      return (
        <div style={{position: "fixed", inset: 0, background: "rgba(0,0,0,.88)", zIndex: 800, display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(12px)"}}>
          <Glass C={C} glow style={{padding: 36, maxWidth: 300, width: "90%", textAlign: "center"}}>
            <div style={{color: BASE.muted, fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: 20}}>⏱ DESCANSO</div>
            <Ring pct={pct} r={56} C={C} stroke={6}>
              <div style={{color: left <= 3 ? BASE.red : C.lime, fontSize: 42, fontWeight: 900, lineHeight: 1}}>{left}</div>
              <div style={{color: BASE.muted, fontSize: 10}}>seg</div>
            </Ring>
            <div style={{marginTop: 24, display: "flex", gap: 10}}>
              <button onClick={() => setLeft((l) => Math.max(0, l - 15))} style={{flex: 1, padding: "10px", borderRadius: 12, border: `1px solid ${BASE.border}`, background: BASE.bg3, color: BASE.muted, fontWeight: 700, fontSize: 13, cursor: "pointer"}}>−15s</button>
              <button onClick={onClose} style={{flex: 1, padding: "10px", borderRadius: 12, border: "none", background: C.g1, color: BASE.bg, fontWeight: 900, fontSize: 13, cursor: "pointer"}}>⏭ Pular</button>
            </div>
          </Glass>
        </div>
      );
    }

    function SOSModal({exercise, onClose, C}) {
      const [msg, setMsg] = useState("");
      const [sent, setSent] = useState(false);
      const [sending, setSending] = useState(false);
      const handleSend = () => {setSending(true); setTimeout(() => {sendHelpAlert(exercise?.name || "—", msg); setSent(true); setTimeout(onClose, 2500); setSending(false);}, 700);};
      return (
        <div style={{position: "fixed", inset: 0, background: "rgba(0,0,0,.92)", zIndex: 900, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, backdropFilter: "blur(12px)"}}>
          <Glass C={C} style={{padding: 26, maxWidth: 360, width: "100%", border: "2px solid rgba(255,124,64,.4)", boxShadow: "0 0 40px rgba(255,124,64,.2)"}}>
            {sent ? (
              <div style={{textAlign: "center", padding: "16px 0"}}>
                <div style={{fontSize: 52, marginBottom: 12}}>✅</div>
                <div style={{color: BASE.green, fontWeight: 900, fontSize: 20, marginBottom: 6}}>Alerta Enviado!</div>
                <div style={{color: BASE.muted, fontSize: 13}}>Seu personal foi notificado.</div>
              </div>
            ) : (
              <>
                <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14}}>
                  <div style={{display: "flex", alignItems: "center", gap: 8}}>
                    <div style={{width: 34, height: 34, borderRadius: 9, background: "rgba(255,124,64,.15)", border: "1px solid rgba(255,124,64,.3)", display: "flex", alignItems: "center", justifyContent: "center"}}><Ic n="handhelp" s={18} c={BASE.orange} /></div>
                    <div><div style={{color: BASE.orange, fontWeight: 900, fontSize: 17, letterSpacing: 1}}>PRECISO DE AJUDA</div><div style={{color: BASE.muted, fontSize: 12}}>Personal será alertado agora</div></div>
                  </div>
                  <button onClick={onClose} style={{background: "none", border: "none", cursor: "pointer", padding: 4}} aria-label="Fechar"><Ic n="x" s={20} c={BASE.muted} /></button>
                </div>
                <div style={{background: BASE.bg3, borderRadius: 11, border: `1px solid ${BASE.border}`, padding: "12px 14px", marginBottom: 13}}>
                  <div style={{color: BASE.dim, fontSize: 10, fontWeight: 700, letterSpacing: .5, marginBottom: 4}}>🏋️ EXERCÍCIO ATUAL</div>
                  <div style={{color: BASE.text, fontWeight: 800, fontSize: 15}}>{exercise?.name || "—"}</div>
                  {exercise?.muscle && <div style={{color: BASE.muted, fontSize: 12, marginTop: 2}}>{exercise.muscle} · {exercise.sets}×{exercise.reps} · {exercise.weight}kg</div>}
                </div>
                <textarea value={msg} onChange={(e) => setMsg(e.target.value)} placeholder="Ex: Não consigo fazer o movimento correto..." rows={3} style={{width: "100%", background: BASE.bg3, border: `1px solid ${BASE.borderHi}`, borderRadius: 10, padding: "10px 12px", color: BASE.text, fontSize: 13, outline: "none", resize: "none", fontFamily: "inherit", lineHeight: 1.5, marginBottom: 14, boxSizing: "border-box"}} />
                <button onClick={handleSend} disabled={sending} style={{width: "100%", padding: 14, borderRadius: 12, border: "none", cursor: "pointer", background: sending ? BASE.bg3 : "linear-gradient(135deg,#ff7c40,#ff4560)", color: sending ? BASE.muted : "#fff", fontWeight: 900, fontSize: 15, boxShadow: sending ? "none" : "0 0 28px rgba(255,124,64,.35)", transition: "all .2s"}}>
                  {sending ? "Enviando..." : "🆘 Chamar Personal Agora"}
                </button>
              </>
            )}
          </Glass>
        </div>
      );
    }

    function CheckinModal({onClose, onSuccess, C}) {
      const [phase, setPhase] = useState("intro");
      const [msg, setMsg] = useState("");
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const stopCamera = () => {if (streamRef.current) {streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null;} };
      const startCamera = async () => {
        setPhase("scanning");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
          streamRef.current = stream;
          if (videoRef.current) videoRef.current.srcObject = stream;
          setTimeout(() => {stopCamera(); checkGPS();}, 2500);
        } catch {setMsg("Câmera não disponível. Simulando leitura do QR..."); setTimeout(() => checkGPS(), 1500);}
      };
      const checkGPS = () => {
        setPhase("gps");
        if (!navigator.geolocation) {setPhase("success"); return;}
        navigator.geolocation.getCurrentPosition(() => {setPhase("success"); if (onSuccess) onSuccess();}, () => {setPhase("success"); if (onSuccess) onSuccess();}, {timeout: 5000});
      };
      useEffect(() => {return () => stopCamera();}, []);
      return (
        <div style={{position: "fixed", inset: 0, background: "rgba(0,0,0,.94)", zIndex: 900, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, backdropFilter: "blur(16px)"}}>
          <Glass C={C} glow style={{padding: 28, maxWidth: 360, width: "100%", textAlign: "center"}}>
            {phase === "intro" && (<><div style={{fontSize: 52, marginBottom: 12}}>📍</div><div style={{color: BASE.text, fontWeight: 900, fontSize: 20, marginBottom: 8}}>Check-in na Academia</div><div style={{color: BASE.muted, fontSize: 13, marginBottom: 22}}>Aponte para o QR Code da entrada para registrar sua presença e ganhar <span style={{color: C.lime}}>+15 VortexCoins</span>!</div><button onClick={startCamera} style={{width: "100%", padding: 15, borderRadius: 14, border: "none", background: C.g1, color: BASE.bg, fontWeight: 900, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, boxShadow: C.limeGlow}}><Ic n="qr" s={20} c={BASE.bg} /> Escanear QR Code</button><button onClick={onClose} style={{marginTop: 12, background: "none", border: "none", color: BASE.muted, cursor: "pointer", fontSize: 14, fontWeight: 600}}>Cancelar</button></>)}
            {phase === "scanning" && (<><div style={{color: C.lime, fontWeight: 900, fontSize: 16, marginBottom: 14}}>📷 Escaneando...</div><div style={{width: "100%", height: 220, borderRadius: 16, overflow: "hidden", background: BASE.bg3, border: `2px solid ${C.lime}40`, position: "relative", marginBottom: 16}}><video ref={videoRef} autoPlay playsInline muted style={{width: "100%", height: "100%", objectFit: "cover"}} /><div style={{position: "absolute", top: 0, left: 0, right: 0, height: 3, background: C.lime, opacity: 0.8, animation: "scanLine 1.5s linear infinite", boxShadow: `0 0 8px ${C.lime}`}} />{msg && <div style={{position: "absolute", bottom: 8, left: 0, right: 0, textAlign: "center", color: C.lime, fontSize: 12, fontWeight: 700}}>{msg}</div>}</div><div style={{color: BASE.muted, fontSize: 12}}>Aponte para o QR Code da academia...</div></>)}
            {phase === "gps" && (<><div style={{fontSize: 48, marginBottom: 12, animation: "pulse 1s ease infinite"}}>📡</div><div style={{color: BASE.text, fontWeight: 800, fontSize: 16, marginBottom: 8}}>Verificando localização...</div><div style={{color: BASE.muted, fontSize: 13}}>Confirmando que você está na academia.</div></>)}
            {phase === "success" && (<><div style={{fontSize: 60, marginBottom: 12, animation: "pop .4s cubic-bezier(.34,1.56,.64,1)"}}>🏆</div><div style={{color: C.lime, fontWeight: 900, fontSize: 22, marginBottom: 6}}>Check-in Confirmado!</div><div style={{color: BASE.muted, fontSize: 13, marginBottom: 16}}>Você está na academia. Bora treinar!</div><div style={{background: C.limeD, border: `1px solid ${C.lime}40`, borderRadius: 12, padding: "12px 16px", marginBottom: 20}}><div style={{color: C.lime, fontWeight: 900, fontSize: 18}}>+15 VortexCoins 🪙</div><div style={{color: BASE.muted, fontSize: 12}}>Adicionados ao seu saldo</div></div><button onClick={onClose} style={{width: "100%", padding: 14, borderRadius: 12, border: "none", background: C.g1, color: BASE.bg, fontWeight: 900, fontSize: 15, cursor: "pointer", boxShadow: C.limeGlow}}>Começar Treino 💪</button></>)}
            {phase === "fail" && (<><div style={{fontSize: 52, marginBottom: 12}}>🚫</div><div style={{color: BASE.red, fontWeight: 900, fontSize: 18, marginBottom: 8}}>Fora do Raio!</div><div style={{color: BASE.muted, fontSize: 13, marginBottom: 20}}>Você está fora da academia! Aproxime-se para fazer check-in.</div><button onClick={onClose} style={{width: "100%", padding: 13, borderRadius: 12, border: "none", background: "rgba(255,69,96,.2)", color: BASE.red, fontWeight: 900, fontSize: 15, cursor: "pointer"}}>Fechar</button></>)}
          </Glass>
        </div>
      );
    }

    function WorkoutSequential({workout, onBack, onFinish, C}) {
      const [currentEx, setCurrentEx] = useState(0);
      const [sets, setSets] = useState(workout.exercises.reduce((acc, ex) => ({...acc, [ex.id]: Array(ex.sets).fill(null).map(() => ({done: false, reps: ex.reps, weight: ex.weight}))}), {}));
      const [timer, setTimer] = useState(null);
      const [sosOpen, setSosOpen] = useState(false);
      const [showFinish, setShowFinish] = useState(false);
      const [touchStart, setTouchStart] = useState(null);
      const ex = workout.exercises[currentEx];
      const progress = workout.exercises.reduce((t, e) => {const d = sets[e.id]?.filter((s) => s.done).length || 0; return t + d / e.sets;}, 0) / workout.exercises.length;
      const allDone = workout.exercises.every((e) => sets[e.id]?.every((s) => s.done));
      const toggleSet = (exId, idx) => {
        const wasDone = sets[exId][idx].done;
        setSets((prev) => {const u = [...prev[exId]]; u[idx] = {...u[idx], done: !u[idx].done}; return {...prev, [exId]: u};});
        if (!wasDone) {setTimer(ex.rest); if ("vibrate" in navigator) navigator.vibrate(50);}
      };
      const goNext = () => {if (currentEx < workout.exercises.length - 1) setCurrentEx((i) => i + 1);};
      const goPrev = () => {if (currentEx > 0) setCurrentEx((i) => i - 1);};
      const handleTouchStart = (e) => setTouchStart(e.touches[0].clientX);
      const handleTouchEnd = (e) => {if (!touchStart) return; const dx = touchStart - e.changedTouches[0].clientX; if (Math.abs(dx) > 60) {if (dx > 0) goNext(); else goPrev();} setTouchStart(null);};
      useEffect(() => {if (allDone) setTimeout(() => setShowFinish(true), 600);}, [allDone]);

      if (showFinish) return (
        <div style={{minHeight: "100vh", background: BASE.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center", position: "relative", overflow: "hidden"}}>
          <Confetti active={true} />
          <div style={{fontSize: 72, marginBottom: 16, animation: "pop .5s cubic-bezier(.34,1.56,.64,1)"}}>🏆</div>
          <div style={{color: C.lime, fontWeight: 900, fontSize: 28, marginBottom: 8}}>TREINO COMPLETO!</div>
          <div style={{color: BASE.muted, fontSize: 15, marginBottom: 24}}>Você arrasou! {workout.exercises.length} exercícios concluídos.</div>
          <Glass C={C} glow style={{padding: 20, width: "100%", maxWidth: 300, marginBottom: 24}}>
            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12}}>
              {[["⏱", workout.duration + "min", "DURAÇÃO"], ["💪", workout.exercises.length, "EXERCÍCIOS"], ["🔥", "520", "KCAL"], ["+50", "XP", "EXPERIÊNCIA"]].map(([icon, val, lbl]) => (
                <div key={lbl} style={{textAlign: "center"}}><div style={{fontSize: 18, marginBottom: 2}}>{icon}</div><div style={{color: C.lime, fontWeight: 900, fontSize: 20}}>{val}</div><div style={{color: BASE.muted, fontSize: 10, fontWeight: 700}}>{lbl}</div></div>
              ))}
            </div>
          </Glass>
          <button onClick={onFinish} style={{width: "100%", maxWidth: 300, padding: 16, borderRadius: 14, border: "none", background: C.g1, color: BASE.bg, fontWeight: 900, fontSize: 17, cursor: "pointer", boxShadow: C.limeGlow}}>Fechar Treino ✓</button>
        </div>
      );

      return (
        <div style={{minHeight: "100vh", background: BASE.bg, fontFamily: "'Oswald',system-ui"}} onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          {timer && <RestTimer seconds={timer} onDone={() => setTimer(null)} onClose={() => setTimer(null)} C={C} />}
          {sosOpen && <SOSModal exercise={ex} onClose={() => setSosOpen(false)} C={C} />}
          <div style={{background: "rgba(7,9,14,0.95)", backdropFilter: "blur(20px)", borderBottom: `1px solid rgba(${C.accentRgb},0.15)`, padding: "14px 18px", position: "sticky", top: 0, zIndex: 100}}>
            <div style={{display: "flex", alignItems: "center", gap: 10, marginBottom: 10}}>
              <button onClick={onBack} style={{background: BASE.bg3, border: "none", borderRadius: 10, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer"}} aria-label="Voltar"><Ic n="chevL" s={18} c={BASE.muted} /></button>
              <div style={{flex: 1, minWidth: 0}}><div style={{color: BASE.text, fontWeight: 900, fontSize: 16, letterSpacing: .5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis"}}>{workout.name}</div><div style={{color: BASE.muted, fontSize: 11, marginTop: 1}}>{workout.exercises.length} exercícios · {workout.duration}min</div></div>
              <div style={{textAlign: "right"}}><div style={{color: C.lime, fontSize: 22, fontWeight: 900}}>{Math.round(progress * 100)}%</div></div>
            </div>
            <div style={{height: 4, background: BASE.bg3, borderRadius: 3}}><div style={{height: "100%", width: `${progress * 100}%`, background: C.g1, borderRadius: 3, transition: "width .5s ease", boxShadow: `0 0 8px rgba(${C.accentRgb},0.6)`}} /></div>
          </div>
          <div style={{display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 0 16px"}}>
            <Ring pct={progress} r={52} C={C} stroke={7}><div style={{color: C.lime, fontSize: 28, fontWeight: 900, lineHeight: 1}}>{currentEx + 1}</div><div style={{color: BASE.muted, fontSize: 11}}>de {workout.exercises.length}</div></Ring>
          </div>
          <div style={{display: "flex", gap: 5, padding: "0 16px 12px", overflowX: "auto"}}>
            {workout.exercises.map((e, i) => {
              const done = sets[e.id]?.every((s) => s.done);
              return <button key={e.id} onClick={() => setCurrentEx(i)} style={{padding: "5px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0, border: `1px solid ${currentEx === i ? C.lime : done ? BASE.green : BASE.border}`, background: currentEx === i ? C.limeD : done ? "rgba(34,208,122,.1)" : BASE.bg2, color: currentEx === i ? C.lime : done ? BASE.green : BASE.muted, transition: "all .2s"}}>{done ? "✓" : i + 1}. {e.name.split(" ").slice(0, 2).join(" ")}</button>;
            })}
          </div>
          <div style={{padding: "0 16px"}}>
            <Glass C={C} glow style={{padding: 20, marginBottom: 12}}>
              <div style={{marginBottom: 14}}>
                <div style={{color: C.lime, fontSize: 11, fontWeight: 700, letterSpacing: 1, marginBottom: 3}}>{(ex.muscle || "—").toUpperCase()}</div>
                <h2 style={{color: BASE.text, fontSize: 22, fontWeight: 900, margin: "0 0 5px", lineHeight: 1.15}}>{ex.name}</h2>
                <div style={{color: BASE.muted, fontSize: 13}}>{ex.sets} séries × {ex.reps} reps · {ex.rest}s descanso</div>
              </div>
              {ex.weight > ex.lastWeight && (
                <div style={{background: `rgba(${C.accentRgb},.07)`, border: `1px solid rgba(${C.accentRgb},.2)`, borderRadius: 10, padding: "9px 12px", marginBottom: 12, display: "flex", gap: 7, alignItems: "center"}}>
                  <Ic n="trending" s={14} c={C.lime} /><span style={{color: C.lime, fontSize: 12, fontWeight: 700}}>Progressão: {ex.weight}kg (+{(ex.weight - ex.lastWeight).toFixed(1)}kg)</span>
                </div>
              )}
              <div style={{display: "flex", flexDirection: "column", gap: 8}}>
                {sets[ex.id]?.map((set, i) => (
                  <div key={i} style={{display: "flex", alignItems: "center", gap: 9, padding: "11px 13px", borderRadius: 12, transition: "all .25s", background: set.done ? "rgba(34,208,122,.1)" : BASE.bg3, border: `1px solid ${set.done ? "rgba(34,208,122,.3)" : BASE.border}`}}>
                    <div style={{color: BASE.muted, fontSize: 13, fontWeight: 700, width: 24, textAlign: "center"}}>S{i + 1}</div>
                    <div style={{flex: 1, display: "flex", gap: 7}}>
                      <div style={{flex: 1}}><div style={{color: BASE.dim, fontSize: 10, fontWeight: 700, marginBottom: 2}}>REPS</div><input type="number" value={set.reps} onChange={(e) => setSets((prev) => {const u = [...prev[ex.id]]; u[i] = {...u[i], reps: +e.target.value}; return {...prev, [ex.id]: u};})} style={{width: "100%", background: "transparent", border: `1px solid ${BASE.border}`, borderRadius: 7, padding: "5px 7px", color: BASE.text, fontSize: 17, fontWeight: 900, outline: "none", textAlign: "center"}} /></div>
                      <div style={{flex: 1}}><div style={{color: BASE.dim, fontSize: 10, fontWeight: 700, marginBottom: 2}}>KG</div><input type="number" value={set.weight} step="2.5" onChange={(e) => setSets((prev) => {const u = [...prev[ex.id]]; u[i] = {...u[i], weight: +e.target.value}; return {...prev, [ex.id]: u};})} style={{width: "100%", background: "transparent", border: `1px solid ${BASE.border}`, borderRadius: 7, padding: "5px 7px", color: C.lime, fontSize: 17, fontWeight: 900, outline: "none", textAlign: "center"}} /></div>
                    </div>
                    <button onClick={() => toggleSet(ex.id, i)} style={{width: 42, height: 42, borderRadius: 11, border: "none", cursor: "pointer", background: set.done ? "rgba(34,208,122,.25)" : BASE.bg2, display: "flex", alignItems: "center", justifyContent: "center", transition: "all .2s", transform: set.done ? "scale(1.05)" : "scale(1)"}} aria-label={`Série ${i + 1} ${set.done ? "concluída" : "pendente"}`}><Ic n="check" s={19} c={set.done ? BASE.green : BASE.dim} w={set.done ? 3 : 2} /></button>
                  </div>

                  <div style={{position: "absolute", top: 0, bottom: 0, left: `${sliderPos}%`, width: 3, background: "#fff", transform: "translateX(-50%)", boxShadow: "0 0 12px rgba(255,255,255,0.8)"}}><div style={{position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 32, height: 32, borderRadius: "50%", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 12px rgba(0,0,0,.4)"}}><span style={{color: BASE.bg, fontSize: 14, fontWeight: 900}}>⇄</span></div></div>
                  <div style={{position: "absolute", top: 10, left: 12, background: "rgba(0,0,0,.6)", borderRadius: 6, padding: "3px 8px", color: BASE.muted, fontSize: 11, fontWeight: 700}}>ANTES</div>
                  <div style={{position: "absolute", top: 10, right: 12, background: `rgba(${C.accentRgb},.3)`, borderRadius: 6, padding: "3px 8px", color: C.lime, fontSize: 11, fontWeight: 700}}>DEPOIS</div>
                </div>
                <div style={{padding: "12px 16px", textAlign: "center"}}><div style={{color: BASE.muted, fontSize: 12}}>Adicione fotos de progresso no painel do seu personal</div></div>

            <div style={{textAlign: "center", padding: "40px 20px", background: BASE.bg1, borderRadius: 18, border: `2px dashed ${BASE.border}`}}><div style={{fontSize: 52, marginBottom: 14}}>📏</div><div style={{color: BASE.text, fontWeight: 800, fontSize: 16, marginBottom: 8}}>Nenhuma medição ainda</div><div style={{color: BASE.muted, fontSize: 13}}>Seu personal ainda não registrou suas medidas.</div></div>

        </div>

            <div style={{display: "flex", alignItems: "center", gap: 11}}>
              <div style={{width: 36, height: 36, borderRadius: 10, background: C.limeD, border: `1px solid rgba(${C.accentRgb},.3)`, display: "flex", alignItems: "center", justifyContent: "center", animation: "neonPulse 3s ease-in-out infinite"}}><Ic n="zap" s={18} c={C.lime} /></div>
              <div><div style={{color: C.lime, fontSize: 20, fontWeight: 900, letterSpacing: 3, lineHeight: 1}}>VORTEX</div><div style={{color: BASE.muted, fontSize: 10, marginTop: 1, letterSpacing: .5}}>Personal: {USER.personal}</div></div>
            </div>
            <div style={{display: "flex", alignItems: "center", gap: 9}}>
              <div style={{background: BASE.bg3, borderRadius: 9, padding: "5px 11px", display: "flex", alignItems: "center", gap: 5, border: `1px solid ${BASE.border}`}}><span style={{color: BASE.gold, fontSize: 13}}>⚡</span><span style={{color: BASE.gold, fontWeight: 900, fontSize: 14}}>{USER.gymCoins}</span></div>
              <button onClick={() => setTab("profile")} style={{background: "none", border: "none", cursor: "pointer", padding: 0}}><Ava name={USER.name} size={36} C={C} /></button>
            </div>
          </div>
          <div style={{paddingBottom: 90, position: "relative", zIndex: 1}}>
            {tab === "home" && <HomeTab workouts={workouts} onStartWorkout={setActiveWorkout} C={C} onCheckin={() => setCheckinOpen(true)} />}
            {tab === "exercises" && <ExercisesTab library={exLibrary} C={C} />}
            {tab === "diet" && <DietTab diet={diet} C={C} />}
            {tab === "progress" && <ProgressTab measures={measures} C={C} />}
            {tab === "notifs" && <NotificationsTab C={C} />}
            {tab === "coins" && <CoinsTab C={C} />}
            {tab === "profile" && <ProfileTab C={C} currentTheme={theme} onThemeChange={setTheme} />}
          </div>
          <nav style={{position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "rgba(7,9,14,0.95)", backdropFilter: "blur(20px)", borderTop: `1px solid rgba(${C.accentRgb},0.12)`, padding: "8px 2px 14px", display: "flex", justifyContent: "space-around", zIndex: 200}}>
            {tabs.map((t) => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "4px 6px", borderTop: active ? `2.5px solid ${C.lime}` : "2.5px solid transparent", position: "relative", minWidth: 44, transition: "all .15s"}} aria-label={t.label} aria-current={active ? "page" : undefined}>
                  <div style={{position: "relative", transform: active ? "translateY(-1px)" : "none", transition: "transform .15s"}}>
                    <Ic n={t.icon} s={20} c={active ? C.lime : BASE.dim} w={active ? 2.5 : 2} />
                    {t.badge > 0 && <div style={{position: "absolute", top: -4, right: -6, background: BASE.red, color: "#fff", borderRadius: 999, fontSize: 9, fontWeight: 900, minWidth: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px", border: `2px solid ${BASE.bg}`}}>{t.badge}</div>}
                  </div>
                  <span style={{color: active ? C.lime : BASE.dim, fontSize: 9, fontWeight: active ? 700 : 500, letterSpacing: .3}}>{t.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<VORTEXApp />);
  </script>
</body>

</html>
